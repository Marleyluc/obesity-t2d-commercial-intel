# Non-secret settings. Secrets (API keys) live in .env, never here.

paths:
  raw: data/raw              # untouched API responses / downloads, one dated folder per pull
  interim: data/interim      # cleaned, joined, not yet analysis-ready
  processed: data/processed  # tables the dashboard reads
  briefs: briefs             # generated weekly briefs
  duckdb: data/processed/obesity_ci.duckdb

sources:
  ctgov:
    base_url: https://clinicaltrials.gov/api/v2
    page_size: 1000           # API maximum
    request_delay_s: 0.5      # be polite; the API has no key but does rate-limit
    # Only the fields we use. Leaving out the results section keeps each snapshot small.
    fields: [NCTId, BriefTitle, Acronym, OverallStatus, WhyStopped, Phase, StudyType,
             StartDate, PrimaryCompletionDate, CompletionDate, StudyFirstPostDate,
             LastUpdatePostDate, LeadSponsorName, LeadSponsorClass, CollaboratorName,
             Condition, InterventionName, InterventionType, EnrollmentCount,
             LocationCountry, HasResults]
    # Condition sweep: catches new entrants not yet in drug_classes.yaml.
    # Restricted to recent interventional Phase 2/3 trials so it stays focused on industry pipeline.
    condition_filter: "AREA[StudyType]INTERVENTIONAL AND AREA[Phase](PHASE2 OR PHASE3) AND AREA[StartDate]RANGE[2018-01-01, MAX]"
  openfda:
    base_url: https://api.fda.gov
    request_delay_s: 0.3      # without a key: 240 req/min, 1,000/day; with a key: 120,000/day
    page_limit: 100           # openFDA maximum per request for these endpoints
  cms_partd:
    catalog_url: https://data.cms.gov/data.json
    dataset_title: "Medicare Part D Prescribers - by Provider and Drug"
    # Reference for the M2 check (scripts/check_partd_totals.py): its National rows give
    # CMS's own total claims per drug, including the small prescribers suppressed above.
    geo_dataset_title: "Medicare Part D Prescribers - by Geography and Drug"
    # null = use the latest year in the catalogue. Part D prescriber data lags roughly two
    # years (e.g. 2024 data is published in 2026). Set a year (e.g. 2023) to pin one.
    data_year: null
    # The full national file is several GB. After filtering it to our drugs with DuckDB we
    # delete it (it is an immutable annual release we can re-download), unless --keep-csv.
    keep_full_csv: false

  # --- Canada (market access layer; there is no public Canadian prescriber-level data) ---
  hc_dpd:
    base_url: https://health-products.canada.ca/api/drug   # Health Canada Drug Product Database API
    request_delay_s: 0.3
    # Search by ingredient only for "newer" classes: for legacy molecules (metformin, old
    # insulins) an ingredient search returns hundreds of generic products, so we search
    # their originator brand names instead.
    ingredient_search_generations: [newer]
  ontario_odb:
    # The open-data catalogue entry (data.ontario.ca) still points to a retired 2019 link on
    # health.gov.on.ca, which no longer resolves (found 2026-11-24). The live "XML Data
    # Extract" is linked from this ontario.ca page, which is updated with each edition, so we
    # read the page and follow its .xml/.xsd links instead of hard-coding a file URL.
    page_url: https://www.ontario.ca/document/ontario-drug-benefit-odb-formulary-comparative-drug-index-cdi-and-monthly-formulary-0
    link_extensions: [xml, xsd]   # the data extract and its schema; PDFs are skipped
  cda_amc:
    # Canada's Drug Agency (formerly CADTH) reimbursement recommendations. No API:
    # a small hand-curated table in config/cda_amc_reviews.csv (built in Milestone 2).
    curated_file: config/cda_amc_reviews.csv
  # Canadian trial activity needs no separate pull: every ClinicalTrials.gov record
  # includes LocationCountry, so M3 filters for "Canada" locally.

http:
  timeout_s: 30
  max_retries: 3
  user_agent: obesity-ci-portfolio/0.1

llm:
  provider: anthropic
  model: claude-sonnet-5-5   # good quality/cost balance for a weekly summary
  max_tokens: 2000
  temperature: 0.2           # low: we want faithful summaries, not creativity

part_d:
  # CMS suppresses any prescriber x drug row with fewer than 11 claims.
  min_claims_threshold: 11
