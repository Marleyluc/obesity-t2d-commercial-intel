# Look and feel of the dashboard (Streamlit theme). Colours match the chart palette in app/common.py.

[theme]
base = "light"
primaryColor = "#0071e3"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f7"
textColor = "#1d1d1f"
linkColor = "#0071e3"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseFontSize = 15
headingFontSizes = ["2.1rem", "1.35rem", "1.1rem"]
headingFontWeights = [700, 650, 600]
baseRadius = "0.8rem"
borderColor = "#e5e5ea"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#f5f5f7"
chartCategoricalColors = ["#257de0", "#f47230", "#00b894"]

[theme.sidebar]
backgroundColor = "#0f1f35"
secondaryBackgroundColor = "#f5f5f7"
textColor = "#e8edf4"
borderColor = "#22385a"

[client]
toolbarMode = "viewer"   # hides the developer "Deploy" menu from viewers

[server]
headless = true
