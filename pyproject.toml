[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obesity-ci"
version = "0.1.0"
description = "Commercial intelligence for the obesity and type 2 diabetes market: competitive landscape tracker and Medicare Part D prescriber segmentation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.4",
    "anthropic>=2.14",
    "streamlit>=1.35",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "jupyter>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
